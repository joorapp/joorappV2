server {
    listen 80;
    server_name joorapp.com; # Replace with your real domain if different

    root /usr/share/nginx/html;
    index index.html;

    # Gzip for faster loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 1. ROUTE: API requests -> Backend container
    # Browser calls: https://joorapp.com/api/v2/...
    location /api/ {
        # 'backend' is the service name in docker-compose.prod.yml
        proxy_pass http://backend:3030; 
        proxy_http_version 1.1;
        
        # Vital headers so the Backend knows who is actually connecting
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        proxy_read_timeout 120s;
    }

    # 2. ROUTE: Frontend Static Files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 3. Cache Control: Don't cache index.html so updates happen immediately
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # 4. Security: Block Keycloak paths from public access
    # Even though Keycloak isn't routed, this is a safety 'deadbolt'
    location /auth {
        return 404;
    }
}